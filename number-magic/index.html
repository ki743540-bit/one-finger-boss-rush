<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#090b10"><title>数字マジック</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#090b10;color:#f9fafb;font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;min-height:100dvh}main{max-width:500px;margin:auto;padding:32px 22px}.top{display:flex;align-items:center;justify-content:space-between;color:#8994a8;font-size:13px}.tag{border:1px solid #303846;padding:5px 10px;border-radius:99px}h1{font-size:32px;letter-spacing:-.05em;margin:60px 0 12px}.sub{color:#9ea7b8;line-height:1.8;margin-bottom:28px}.panel{padding:24px;border:1px solid #2b3240;border-radius:28px;background:linear-gradient(150deg,#171d29,#10131a)}button{width:100%;background:#e9edf8;color:#151923;border:0;border-radius:16px;font:700 17px system-ui;padding:19px;cursor:pointer}button:disabled{opacity:.5}.hint{font-size:13px;color:#95a0b4;line-height:1.7;margin-top:15px}.status{margin:20px 0;color:#b7c3d7;font-size:15px}.dot{display:inline-block;background:#75f1ac;width:8px;height:8px;border-radius:50%;margin-right:8px;box-shadow:0 0 14px #75f1ac}.manual{margin-top:32px;border-top:1px solid #303642;padding-top:18px}input{padding:15px;width:100%;border:1px solid #434b5b;background:#0b0e16;color:#fff;font:18px system-ui;border-radius:14px;margin:10px 0}button.secondary{background:#242c39;color:#e9edf8}#reveal{display:none;position:fixed;inset:0;background:radial-gradient(ellipse at 50% 40%,#202c4b 0,#090b10 65%);align-items:center;justify-content:center;flex-direction:column}#number{font-size:clamp(150px,43vw,300px);font-weight:800;letter-spacing:-.08em;line-height:1}#reveal small{color:#aab6cb;position:absolute;bottom:10vh}#error{color:#ffaf9d;white-space:pre-wrap;font-size:14px;line-height:1.8}#heard{font-size:13px;color:#9ba7bd;min-height:20px;margin-top:12px}
.microw{display:flex;align-items:center;gap:10px;margin:15px 0 6px;color:#aebacf;font-size:12px}.met{flex:1;height:9px;background:#30394b;border-radius:99px;overflow:hidden}.met i{display:block;height:100%;width:0;background:linear-gradient(90deg,#62d7b9,#baf28a);border-radius:99px;transition:width .1s}.speedrow{display:grid;gap:7px;margin:20px 0}.speedrow label{font-size:13px;color:#b6c1d5}select{width:100%;background:#202838;color:#f0f4ff;border:1px solid #414c60;border-radius:13px;padding:12px;font-size:15px}.note{font-size:12px;color:#9ba8ba;line-height:1.6;margin-top:6px}#diagnose{font-size:12px;color:#aab6c9;min-height:20px}
</style>
</head><body><main id="setup"><div class="top"><span>NUMBER MAGIC</span><span class="tag">1 — 100</span></div><h1>声だけで、<br>数字を仕込む。</h1><p class="sub">マイクの開始を押して、1〜100の数字を声に出すだけ。認識した数字を画面に固定します。</p><div class="panel"><button id="start">マイクを許可して開始</button><div id="status" class="status">待機中</div><div id="heard" aria-live="polite"></div><div class="microw"><span>マイク入力</span><div class="met"><i id="level"></i></div></div><div id="diagnose">声を出して、緑のメーターが動くか確認してね。</div><div class="speedrow"><label for="mode">反応モード</label><select id="mode"><option value="quick">高速（短い声にも反応）</option><option value="accurate">正確さ優先（誤認識を減らす）</option></select><div class="note">反応を速くする設定です。スマホ本体のマイク感度を変更するものではありません。</div></div><div id="error"></div><p class="hint">10〜30cmほどの距離で「37」のように数字をはっきり言うと認識しやすいです。初回はChromeのマイク許可を求めます。一度拒否した場合はChromeのサイト設定から許可し直してください。HTTPS環境と対応ブラウザーが必要です。</p><div class="manual"><label for="manual">音声が使えないときの予備入力</label><input id="manual" inputmode="numeric" type="number" min="1" max="100" placeholder="1〜100"><button class="secondary" id="show">数字を表示</button></div></div></main><div id="reveal"><div id="number"></div><small>画面を長押ししてリセット</small></div>
<script>
const $=id=>document.getElementById(id);
const Recognition=window.SpeechRecognition||window.webkitSpeechRecognition;
let recognition=null, active=false, fixed=false, restartTimer=null, candidateTimer=null, candidateValue=null;
let stream=null, context=null, analyser=null, meterFrame=null, sessionId=0, restartAttempts=0;
const kanDigits={'〇':0,'零':0,'一':1,'二':2,'三':3,'四':4,'五':5,'六':6,'七':7,'八':8,'九':9};
const kanaDigits={'いち':1,'に':2,'さん':3,'よん':4,'し':4,'ご':5,'ろく':6,'なな':7,'しち':7,'はち':8,'きゅう':9,'く':9};
const units='きゅう|しち|なな|よん|さん|はち|ろく|いち|に|く|し|ご';
function parseNumber(raw){
  let s=String(raw||'').normalize('NFKC').replace(/[\s、。！？!?,]/g,'');
  // Ignore any example numbers before the final "数字は / 答えは".
  const marker=[...s.matchAll(/(?:数字|答え)(?:は|が|を)?/g)].pop();
  if(marker) s=s.slice(marker.index+marker[0].length);
  const numeric=[...s.matchAll(/(?<!\d)(?:100|[1-9]\d?)(?!\d)/g)];
  if(numeric.length){const n=Number(numeric[numeric.length-1][0]);if(n>=1&&n<=100)return n;}
  const kan=[...s.matchAll(/[〇零一二三四五六七八九十百]+/g)].map(m=>m[0]);
  for(let i=kan.length-1;i>=0;i--){
    const k=kan[i];
    if(k==='百'||k==='一百')return 100;
    if(k.includes('百'))continue;
    let n=null;
    if(k.includes('十')){
      const [t,u]=k.split('十');
      if((t===''||t.length===1)&&(u===''||u.length===1))
        n=(t?kanDigits[t]:1)*10+(u?kanDigits[u]:0);
    }else if(k.length===1)n=kanDigits[k];
    if(Number.isInteger(n)&&n>=1&&n<=100)return n;
  }
  const kana=s.replace(/[\u30A1-\u30F6]/g,c=>String.fromCharCode(c.charCodeAt(0)-0x60))
    .replace(/じっ|じゅっ/g,'じゅう').replace(/(?:です|だよ|でした|だ|ね|よ)$/,'');
  if(kana==='ひゃく')return 100;
  const ten=new RegExp('^('+units+')?じゅう('+units+')?</body></html>);
  const tm=kana.match(ten);
  if(tm){const n=(tm[1]?kanaDigits[tm[1]]:1)*10+(tm[2]?kanaDigits[tm[2]]:0);if(n>=1&&n<=100)return n;}
  if(Object.prototype.hasOwnProperty.call(kanaDigits,kana))return kanaDigits[kana];
  return null;
}
function stopMeter(){
  if(meterFrame!==null){cancelAnimationFrame(meterFrame);meterFrame=null;}
  if(context){context.close().catch(()=>{});context=null;}
  if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;}
  $('level').style.width='0%';
}
function startMeter(s){
  try{
    const AC=window.AudioContext||window.webkitAudioContext;
    if(!AC)return;
    context=new AC();
    const source=context.createMediaStreamSource(s);
    analyser=context.createAnalyser();analyser.fftSize=1024;source.connect(analyser);
    const buffer=new Float32Array(analyser.fftSize);
    function paint(){
      if(!active||fixed)return;
      analyser.getFloatTimeDomainData(buffer);
      let power=0;for(let i=0;i<buffer.length;i++)power+=buffer[i]*buffer[i];
      const rms=Math.sqrt(power/buffer.length);
      const pct=Math.max(0,Math.min(100,Math.round(rms*1250)));
      $('level').style.width=pct+'%';
      meterFrame=requestAnimationFrame(paint);
    }
    paint();
  }catch(e){$('diagnose').textContent='入力メーターを利用できません。音声認識は引き続き試せます。';}
}
function clearCandidate(){clearTimeout(candidateTimer);candidateTimer=null;candidateValue=null;}
function showNumber(n){
  if(fixed||!Number.isInteger(n)||n<1||n>100)return;
  fixed=true;active=false;sessionId++;
  clearTimeout(restartTimer);clearCandidate();
  try{recognition?.abort();}catch(e){}
  stopMeter();
  $('number').textContent=String(n);
  $('reveal').style.display='flex';
  $('setup').style.display='none';
}
function fail(message){
  active=false;sessionId++;clearTimeout(restartTimer);clearCandidate();
  stopMeter();
  try{recognition?.abort();}catch(e){}
  $('status').textContent='停止中';
  $('error').textContent=message;
  $('start').disabled=false;
  $('start').textContent='もう一度試す';
}
function scheduleRestart(id){
  if(!active||fixed||id!==sessionId)return;
  clearTimeout(restartTimer);
  restartTimer=setTimeout(()=>listen(id),Math.min(1800,250+restartAttempts*120));
}
function listen(id){
  if(!active||fixed||id!==sessionId)return;
  try{recognition.start();}
  catch(e){
    restartAttempts++;
    if(restartAttempts>6)fail('マイクを再開できません。ブラウザーを再読み込みして試してください。');
    else scheduleRestart(id);
  }
}
function acceptInterim(n,transcript,id){
  if($('mode').value!=='quick'||n===null){clearCandidate();return;}
  // Don't lock on an unfinished word: allow the interim transcript to stabilize.
  if(candidateValue!==n){candidateValue=n;clearTimeout(candidateTimer);}
  else clearTimeout(candidateTimer);
  candidateTimer=setTimeout(()=>{
    if(id===sessionId&&!fixed&&active&&candidateValue===n)showNumber(n);
  },850);
}
$('start').onclick=async()=>{
  if(active||fixed)return;
  $('error').textContent='';$('heard').textContent='';$('diagnose').textContent='声を出して、緑のメーターが動くか確認してね。';
  $('start').disabled=true;$('start').textContent='マイクを確認中…';
  if(!window.isSecureContext){fail('HTTPSで開いてください。');return;}
  if(!navigator.mediaDevices?.getUserMedia){fail('このブラウザーではマイクが利用できません。Chromeで開いてください。');return;}
  if(!Recognition){fail('音声認識に非対応です。AndroidのChrome最新版をお試しください。');return;}
  try{
    stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}});
  }catch(e){
    const msg=e.name==='NotAllowedError'?'マイクが拒否されています。Chromeのサイト設定 → マイクで許可してください。':
      'マイクを開けませんでした：'+e.message;
    fail(msg);return;
  }
  active=true;const id=++sessionId;restartAttempts=0;
  $('start').textContent='音声を待機中';$('status').textContent='起動中…';startMeter(stream);
  recognition=new Recognition();recognition.lang='ja-JP';
  recognition.continuous=false; // Some Android devices finish short utterances more reliably in single-phrase mode.
  recognition.interimResults=true;
  recognition.maxAlternatives=3;
  recognition.onstart=()=>{
    if(id!==sessionId)return;
    restartAttempts=0;$('status').innerHTML='<span class="dot"></span>聞き取り中';
  };
  recognition.onspeechstart=()=>{if(id===sessionId)$('status').textContent='声を検知しました…';};
  recognition.onresult=(e)=>{
    if(id!==sessionId||!active)return;
    for(let i=e.resultIndex;i<e.results.length;i++){
      const result=e.results[i],transcript=result[0]?.transcript||'';
      $('heard').textContent='認識：'+transcript+(result.isFinal?'':'（途中）');
      let n=null;
      for(let j=0;j<result.length;j++){n=parseNumber(result[j].transcript);if(n!==null)break;}
      if(result.isFinal){
        clearCandidate();
        if(n!==null){showNumber(n);return;}
        $('diagnose').textContent='声は届いています。数字を短くはっきり言ってください。';
      }else{
        acceptInterim(n,transcript,id);
      }
    }
  };
  recognition.onerror=(e)=>{
    if(id!==sessionId||fixed||!active)return;
    if(['not-allowed','service-not-allowed','audio-capture'].includes(e.error)){
      fail('音声認識が使えません（'+e.error+'）。Chromeのマイク許可を確認してください。');
    }else if(e.error==='network'){
      fail('音声認識サービスに接続できません。通信環境を確認してください。');
    }else if(e.error==='no-speech'){
      $('diagnose').textContent='声を検出できませんでした。近づいてもう一度話してください。';
    }else{
      $('diagnose').textContent='認識を再試行中です（'+e.error+'）。';
    }
  };
  recognition.onend=()=>{if(id===sessionId&&active&&!fixed)scheduleRestart(id);};
  listen(id);
};
$('show').onclick=()=>{
  const raw=$('manual').value.trim(),n=Number(raw);
  if(raw!==''&&Number.isInteger(n)&&n>=1&&n<=100)showNumber(n);
  else $('error').textContent='1〜100の整数を入れてください。';
};
let resetTimer=null;
$('reveal').addEventListener('pointerdown',()=>resetTimer=setTimeout(()=>location.reload(),1100));
for(const event of ['pointerup','pointercancel','pointerleave'])$('reveal').addEventListener(event,()=>clearTimeout(resetTimer));
</script></body></html>
