<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#090b10"><title>数字マジック</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#090b10;color:#f9fafb;font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;min-height:100dvh}main{max-width:500px;margin:auto;padding:32px 22px}.top{display:flex;align-items:center;justify-content:space-between;color:#8994a8;font-size:13px}.tag{border:1px solid #303846;padding:5px 10px;border-radius:99px}h1{font-size:32px;letter-spacing:-.05em;margin:60px 0 12px}.sub{color:#9ea7b8;line-height:1.8;margin-bottom:28px}.panel{padding:24px;border:1px solid #2b3240;border-radius:28px;background:linear-gradient(150deg,#171d29,#10131a)}button{width:100%;background:#e9edf8;color:#151923;border:0;border-radius:16px;font:700 17px system-ui;padding:19px;cursor:pointer}button:disabled{opacity:.5}.hint{font-size:13px;color:#95a0b4;line-height:1.7;margin-top:15px}.status{margin:20px 0;color:#b7c3d7;font-size:15px}.dot{display:inline-block;background:#75f1ac;width:8px;height:8px;border-radius:50%;margin-right:8px;box-shadow:0 0 14px #75f1ac}.manual{margin-top:32px;border-top:1px solid #303642;padding-top:18px}input{padding:15px;width:100%;border:1px solid #434b5b;background:#0b0e16;color:#fff;font:18px system-ui;border-radius:14px;margin:10px 0}button.secondary{background:#242c39;color:#e9edf8}#reveal{display:none;position:fixed;inset:0;background:radial-gradient(ellipse at 50% 40%,#202c4b 0,#090b10 65%);align-items:center;justify-content:center;flex-direction:column}#number{font-size:clamp(150px,43vw,300px);font-weight:800;letter-spacing:-.08em;line-height:1}#reveal small{color:#aab6cb;position:absolute;bottom:10vh}#error{color:#ffaf9d;white-space:pre-wrap;font-size:14px;line-height:1.8}#heard{font-size:13px;color:#9ba7bd;min-height:20px;margin-top:12px}</style>
</head><body><main id="setup"><div class="top"><span>NUMBER MAGIC</span><span class="tag">1 — 100</span></div><h1>声だけで、<br>数字を仕込む。</h1><p class="sub">マイクの開始を押して、1〜100の数字を声に出すだけ。認識した数字を画面に固定します。</p><div class="panel"><button id="start">マイクを許可して開始</button><div id="status" class="status">待機中</div><div id="heard"></div><div id="error"></div><p class="hint">初回はChromeのマイク許可を求めます。一度拒否した場合はChromeのサイト設定から許可し直してください。HTTPS環境と対応ブラウザーが必要です。</p><div class="manual"><label for="manual">音声が使えないときの予備入力</label><input id="manual" inputmode="numeric" type="number" min="1" max="100" placeholder="1〜100"><button class="secondary" id="show">数字を表示</button></div></div></main><div id="reveal"><div id="number"></div><small>画面を長押ししてリセット</small></div>
<script>
const $=id=>document.getElementById(id),Rec=window.SpeechRecognition||window.webkitSpeechRecognition;let recog=null,active=false,fixed=false,retry=null;const digits={'零':0,'一':1,'二':2,'三':3,'四':4,'五':5,'六':6,'七':7,'八':8,'九':9};const spoken={'いち':1,'に':2,'さん':3,'よん':4,'し':4,'ご':5,'ろく':6,'なな':7,'しち':7,'はち':8,'きゅう':9,'く':9,'じゅう':10,'ひゃく':100};
function parseNumber(raw){let s=raw.normalize('NFKC').replace(/[\s、。！？]/g,'');let match=s.match(/(?:100|[1-9]?\d)(?!\d)/);if(match){const n=Number(match[0]);if(n>=1&&n<=100)return n}
const kan=s.match(/[一二三四五六七八九十百]+/g)||[];for(const k of kan){if(k.includes('百')){if(k==='百'||k==='一百')return 100;continue}let n=0;if(k.includes('十')){let [a,b]=k.split('十');n=(a?digits[a]:1)*10+(b?digits[b]:0)}else if(k.length===1)n=digits[k];if(n>=1&&n<=100)return n}
s=s.replace(/あなたの|思い浮かべた|数字は|数字|です|だよ|でした|正解|答え|番|を|は|と|って|なんと|なんだ|じゅっ/gu,x=>x==='じゅっ'?'じゅう':'');for(const [word,n] of Object.entries(spoken)){if(s===word)return n}let m=s.match(/(きゅう|く|はち|なな|しち|ろく|ご|よん|し|さん|に|いち)?じゅう(きゅう|く|はち|なな|しち|ろく|ご|よん|し|さん|に|いち)?/);if(m){const n=(m[1]?spoken[m[1]]:1)*10+(m[2]?spoken[m[2]]:0);if(n>=1&&n<=100)return n}
return null}
function render(n){if(fixed)return;fixed=true;active=false;clearTimeout(retry);try{recog?.stop()}catch{};$('number').textContent=String(n);$('reveal').style.display='flex';$('setup').style.display='none'}
function fail(msg){active=false;$('status').textContent='停止中';$('error').textContent=msg;$('start').disabled=false;$('start').textContent='もう一度試す'}
function listen(){if(!active||fixed)return;try{recog.start()}catch(e){fail('音声認識を開始できませんでした。Chromeで開いているか確認してください。')}}
$('start').onclick=async()=>{if(active)return;$('error').textContent='';$('start').disabled=true;$('start').textContent='マイクの許可を確認中…';if(!window.isSecureContext){fail('HTTPSのページで開いてください。ローカルファイルやプレビューでは動かない場合があります。');return}if(!navigator.mediaDevices?.getUserMedia){fail('このブラウザーではマイク権限APIが利用できません。AndroidのChromeで開いてください。');return}if(!Rec){fail('このブラウザーは日本語音声認識に対応していません。Chrome最新版を試してください。');return}
try{const stream=await navigator.mediaDevices.getUserMedia({audio:true});stream.getTracks().forEach(t=>t.stop())}catch(e){fail(e.name==='NotAllowedError'?'マイクが拒否されています。Chromeのサイト設定 → マイク → このサイトを「許可」に変更してください。':'マイクに接続できませんでした：'+e.message);return}
active=true;recog=new Rec();recog.lang='ja-JP';recog.continuous=true;recog.interimResults=false;recog.onstart=()=>{$('status').innerHTML='<span class="dot"></span>音声を待機中';$('start').textContent='待機中…'};recog.onresult=e=>{for(let i=e.resultIndex;i<e.results.length;i++){if(!e.results[i].isFinal)continue;let t=e.results[i][0].transcript;$('heard').textContent='認識：'+t;let n=parseNumber(t);if(n!==null){render(n);return}}};recog.onerror=e=>{if(fixed)return;if(e.error==='not-allowed'||e.error==='service-not-allowed'){fail('音声認識が拒否されました。Chromeのサイト設定からマイクを許可してください。')}else if(e.error==='network'){fail('音声認識サービスに接続できません。通信状態を確認してください。')}else $('status').textContent='聞き取れませんでした。再試行します'};recog.onend=()=>{if(active&&!fixed){retry=setTimeout(listen,450)}};listen()};
$('show').onclick=()=>{const n=Number($('manual').value);if(Number.isInteger(n)&&n>=1&&n<=100)render(n);else $('error').textContent='1〜100の整数を入れてください。'};
let timer=null;$('reveal').addEventListener('pointerdown',()=>timer=setTimeout(()=>location.reload(),1100));for(const k of ['pointerup','pointercancel','pointerleave'])$('reveal').addEventListener(k,()=>clearTimeout(timer));
</script></body></html>
